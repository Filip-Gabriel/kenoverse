IT<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>YouTube Embed Relay</title>
  <style>
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <div id="player"></div>

  <script>
    const u = new URL(location.href);
    const videoId = u.searchParams.get('v');

    if (!videoId) {
        document.body.innerHTML = '<h2 style="color:white;text-align:center;padding-top:20px;">Missing Video ID (?v=...)</h2>';
    }

    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: videoId,
        playerVars: {
          'autoplay': 0,
          'controls': 1,
          'rel': 0,
          'origin': location.origin,
          'enablejsapi': 1,
          'modestbranding': 1,
          'playsinline': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    }

    function onPlayerReady(event) {
      sendMessageToFlutter({ event: 'onReady' });
    }

    function onPlayerStateChange(event) {
      sendMessageToFlutter({ event: 'onStateChange', info: event.data });
    }

    function onPlayerError(event) {
      sendMessageToFlutter({ event: 'onError', info: event.data });
    }

    function sendMessageToFlutter(data) {
      if (window.flutter_inappwebview) {
        window.flutter_inappwebview.callHandler('onYouTubeMessage', data);
      } else {
        // Fallback for generic postMessage if needed
        window.parent.postMessage(JSON.stringify(data), "*");
      }
    }

    // Time update loop
    setInterval(function() {
      if (player && player.getCurrentTime) {
        sendMessageToFlutter({
          event: 'onTimeUpdate',
          info: { currentTime: player.getCurrentTime() }
        });
      }
    }, 250);

    // Listen for commands from Flutter
    window.addEventListener("flutter_command", function(e) {
      const data = e.detail;
      if (player && player[data.func]) {
        player[data.func](data.args || []);
      }
    });

    // Handle standard message events for broader compatibility
    window.addEventListener("message", function(event) {
        try {
            const data = JSON.parse(event.data);
            if (data.func && player && player[data.func]) {
                player[data.func](data.args || []);
            }
        } catch (e) {}
    });
  </script>
</body>
</html>
